# Public-tree hygiene guard. Parser implementations and their source hosts are
# intentionally public; this workflow checks only for development/operator
# artifacts accidentally copied into the visitor-facing static tree.
name: Public tree artifact scanner

on:
  push:
    branches: [main]
    paths:
      - "02_Core_Project/council_navigator/**"
      - "ops/scan_public_tree_for_dev_artifacts.py"
      - ".github/workflows/artifact-scanner.yml"
  pull_request:
    paths:
      - "02_Core_Project/council_navigator/**"
      - "ops/scan_public_tree_for_dev_artifacts.py"
      - ".github/workflows/artifact-scanner.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Scan built artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: "02_Core_Project/council_navigator/pnpm-lock.yaml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install web deps
        working-directory: 02_Core_Project/council_navigator
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        working-directory: 02_Core_Project/council_navigator
        run: pnpm build

      - name: Scan client/public for development and operator artifacts
        run: python3 ops/scan_public_tree_for_dev_artifacts.py
